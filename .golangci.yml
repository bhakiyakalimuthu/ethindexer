version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errname
    - errorlint
    - gocheckcompilerdirectives
    - gosec
    - loggercheck
    - makezero
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - zerologlint
  exclusions:
    generated: strict
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - ethindexer
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
