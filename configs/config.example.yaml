app:
  environment: development
  log_level: info

http:
  address: ":8080"
  request_timeout: 5s
  read_header_timeout: 5s
  idle_timeout: 60s
  shutdown_timeout: 15s

ethereum:
  # Prefer the ETH_RPC_URL environment variable for real credentials.
  rpc_url: "http://localhost:8545"
  chain_id: 1
  rpc_timeout: 30s
  rpc_concurrency: 4

indexer:
  poll_interval: 4s
  block_window: 50
  head_mode: latest
  retry_attempts: 3
  retry_min_backoff: 1s
  retry_max_backoff: 10s

database:
  # Prefer the DATABASE_URL environment variable outside local development.
  url: "postgres://indexer:indexer@localhost:5432/indexer?sslmode=disable"
  max_connections: 12
  min_connections: 2
  connect_timeout: 10s
